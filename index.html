```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Student Registration</h1>

            <p class="subtitle">
                Create your student account
            </p>


            <form id="registrationForm">


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                    >

                    <small id="nameError"></small>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        maxlength="10"
                        placeholder="Enter 10-digit phone number"
                    >

                    <small id="phoneError"></small>

                </div>


                <!-- Date of Birth -->

                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                    >

                    <small id="dobError"></small>

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <div class="gender-options">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small id="genderError"></small>

                </div>


                <!-- Course -->

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="B.E">
                            B.E
                        </option>

                        <option value="B.Sc">
                            B.Sc
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                    </select>

                    <small id="courseError"></small>

                </div>


                <!-- Department -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department">

                        <option value="">
                            Select Department
                        </option>

                        <option value="AI & DS">
                            Artificial Intelligence & Data Science
                        </option>

                        <option value="CSE">
                            Computer Science Engineering
                        </option>

                        <option value="ECE">
                            Electronics & Communication Engineering
                        </option>

                        <option value="EEE">
                            Electrical & Electronics Engineering
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                        <option value="MECH">
                            Mechanical Engineering
                        </option>

                    </select>

                    <small id="departmentError"></small>

                </div>


                <!-- Year -->

                <div class="form-group">

                    <label for="year">
                        Year of Study
                    </label>

                    <select id="year">

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                    <small id="yearError"></small>

                </div>


                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="Enter your address"
                    ></textarea>

                    <small id="addressError"></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >

                    <small id="passwordError"></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter password"
                    >

                    <small id="confirmPasswordError"></small>

                </div>


                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        I agree to the Terms and Conditions

                    </label>

                    <small id="termsError"></small>

                </div>


                <!-- Buttons -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="register-btn">

                        Register

                    </button>

                    <button
                        type="reset"
                        class="reset-btn">

                        Reset

                    </button>

                </div>


                <!-- Success Message -->

                <div id="successMessage"></div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
